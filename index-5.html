<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b">
<title>فاکتور ساز بازار</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f5;color:#17231e}header{background:#087f5b;color:#fff;padding:18px 14px}h1{font-size:22px;margin:0 0 7px}header p{margin:0;font-size:13px}nav{display:flex;gap:7px;margin-top:14px}button{font:inherit;border:0;border-radius:10px;padding:10px;cursor:pointer}nav button{flex:1;background:#ffffff22;color:#fff;border:1px solid #ffffff55;font-size:13px}nav button.active{background:#fff;color:#075a42}main{max-width:950px;margin:auto;padding:13px}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;min-width:0}input,select{font:inherit;padding:11px;border:1px solid #d6e0da;border-radius:10px;background:#fff;width:100%}.primary{background:#087f5b;color:#fff;font-weight:bold}.secondary{background:#e4f2eb;color:#075a42}.danger{background:#fff0f0;color:#c92a2a}.small{padding:7px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product,.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #10271b0d;border:1px solid #e7eee9}.product img{width:100%;height:140px;object-fit:cover;background:#e9f2ec;display:block}.info{padding:10px}.product h3{font-size:15px;margin:0 0 8px}.price{font-size:13px;color:#087f5b;font-weight:bold;margin-bottom:9px}.actions{display:flex;gap:6px}.actions button{flex:1;font-size:12px;padding:9px}.empty{text-align:center;color:#64746c;background:#fff;border:1px dashed #cbd9d0;border-radius:14px;padding:25px;grid-column:1/-1}.card{padding:14px;margin-bottom:13px}.card h2{font-size:17px;margin:0 0 13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:13px;margin-bottom:6px;color:#64746c}.full{grid-column:1/-1}.preview{width:100%;height:120px;object-fit:contain;background:#f1f5f2;border-radius:10px;margin-top:8px;display:none}.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #edf1ee}.grow{flex:1;min-width:0}.muted{font-size:12px;color:#64746c}.cartitem{display:grid;grid-template-columns:55px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ee}.cartitem img{width:55px;height:55px;object-fit:cover;border-radius:8px}.cartitem h3{font-size:14px;margin:0 0 6px}.quantity{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.quantity input{width:85px;padding:8px}.quantity select{width:95px;padding:8px}.lineprice{font-weight:bold;color:#087f5b;margin-top:7px}.shopqty{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}.shopqty input{width:85px;padding:8px}.shopqty select{width:100px;padding:8px}.shopqty button{padding:8px;font-size:12px}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:14px;flex-wrap:wrap}.total{font-size:20px;color:#087f5b;font-weight:bold}.actionsline{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.notice{font-size:12px;line-height:1.8;color:#64746c;margin-top:10px}footer{text-align:center;color:#718078;font-size:11px;padding:20px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product img{height:180px}}
</style></head><body>
<header><h1>🧾 فاکتور ساز بازار</h1><p>ثبت کالا، قیمت‌گذاری و محاسبه سریع فاکتور فروش</p><nav><button class="active" data-tab="shop">🛒 انتخاب کالا</button><button data-tab="cart">🧾 فاکتور <span id="cartCount">۰</span></button><button data-tab="manage">⚙️ مدیریت کالا</button></nav></header>
<main>
<section id="shop" class="panel active"><div class="toolbar"><input id="search" placeholder="جست‌وجوی کالا…"><button class="secondary" id="goManage" type="button">＋ ثبت کالا</button></div><div id="productGrid" class="grid"></div></section>
<section id="cart" class="panel"><div class="card"><h2>فاکتور فروش</h2><div class="field"><label for="buyer">نام خریدار (اختیاری)</label><input id="buyer" placeholder="نام مشتری"></div><div id="cartItems"></div><div class="summary"><span>جمع کل فاکتور</span><span class="total" id="total">۰ تومان</span></div><div class="actionsline"><button class="primary" id="shareInvoice">📤 اشتراک‌گذاری فاکتور</button><button class="secondary" id="copyInvoice">کپی متن فاکتور</button><button class="danger" id="clearCart">خالی کردن فاکتور</button></div><p class="notice">برای کالای کیلویی وزن را برحسب گرم یا کیلو وارد کنید.</p></div></section>
<section id="manage" class="panel"><div class="card"><h2 id="formTitle">➕ ثبت کالای جدید</h2><form id="productForm"><input type="hidden" id="editId"><div class="formgrid"><div class="field full"><label for="pname">نام کالا</label><input id="pname" required placeholder="مثلاً عدس"></div><div class="field"><label for="pprice">قیمت (تومان)</label><input id="pprice" required type="number" min="0" step="any" placeholder="مثلاً ۱۲۰۰۰۰"></div><div class="field"><label for="punit">واحد قیمت</label><select id="punit"><option value="kg">هر کیلوگرم</option><option value="g">هر گرم</option><option value="piece">هر عدد</option></select></div><div class="field full"><label for="pimage">عکس کالا (از گوشی انتخاب کنید)</label><input id="pimage" type="file" accept="image/*"><img id="preview" class="preview" alt="پیش‌نمایش عکس"></div></div><div class="actionsline"><button class="primary" type="submit" id="saveProduct">ذخیره کالا</button><button class="secondary" type="button" id="cancelEdit" style="display:none">لغو ویرایش</button></div></form><p class="notice">اطلاعات در همین مرورگر و همین دستگاه ذخیره می‌شود.</p></div><div class="card"><h2>کالاهای ثبت‌شده</h2><div class="actionsline"><button class="secondary" type="button" id="backupData">⬇️ پشتیبان کالاها</button><button class="secondary" type="button" id="restoreData">⬆️ بازیابی پشتیبان</button><input id="restoreFile" type="file" accept="application/json,.json" style="display:none"></div><div id="manageList"></div></div></section>
</main><footer>فاکتور ساز بازار · نسخه وب موبایل</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}).format(n);
const money = n => fmt(Math.round(n))+' تومان';
const placeholder = 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300"><rect width="100%" height="100%" fill="#e9f2ec"/><text x="50%" y="55%" text-anchor="middle" font-size="58">🛍️</text></svg>');
let products=[], cart={}, imageData='', db=null, saveTimer=null;
// IndexedDB supports larger product photos and persists more reliably than localStorage.
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open('BazarInvoiceDB',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('data'))d.createObjectStore('data');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('DB open failed'));});}
function dbGet(key){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function dbSet(key,value){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('DB write failed'));tx.onabort=()=>reject(tx.error||new Error('DB write aborted'));});}
async function initStorage(){
 try{db=await openDB();products=await dbGet('products')||[];cart=await dbGet('cart')||{};
   // One-time migration from the previous version.
   if(!products.length){try{const old=JSON.parse(localStorage.getItem('fs_products')||'[]');if(old.length){products=old;await dbSet('products',products);localStorage.removeItem('fs_products');}}catch(e){}}
   if(!Object.keys(cart).length){try{cart=JSON.parse(localStorage.getItem('fs_cart')||'{}');if(Object.keys(cart).length){await dbSet('cart',cart);localStorage.removeItem('fs_cart');}}catch(e){}}
 }catch(e){db=null;try{products=JSON.parse(localStorage.getItem('fs_products')||'[]');cart=JSON.parse(localStorage.getItem('fs_cart')||'{}');}catch(_){products=[];cart={};}}
 // Repair duplicate/missing IDs so editing and deleting always target one product.
 const seen=new Set();products=products.map(p=>{let id=String(p.id||'');if(!id||seen.has(id))id='p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);seen.add(id);return {...p,id};});
 renderProducts();renderManage();renderCart();
}
function save(){
 // Save immediately so leaving the page right after a change does not lose it.
 (async()=>{try{if(db){await dbSet('products',products);await dbSet('cart',cart);}else{localStorage.setItem('fs_products',JSON.stringify(products));localStorage.setItem('fs_cart',JSON.stringify(cart));}}
 catch(e){alert('ذخیره‌سازی انجام نشد. احتمالاً حافظه گوشی پر است یا مرورگر اجازه ذخیره نمی‌دهد. از گزینه «پشتیبان کالاها» استفاده کنید و عکس‌های کوچک‌تر انتخاب کنید.');}})();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function switchTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='cart')renderCart();if(id==='manage')renderManage();if(id==='shop')renderProducts();window.scrollTo(0,0);}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('goManage').addEventListener('click',()=>switchTab('manage'));
$('search').addEventListener('input',renderProducts);
function productUnit(p){return p.unit==='piece'?'عدد':p.unit==='g'?'گرم':'کیلوگرم';}
function priceFor(p,q,u){if(p.unit==='kg')return p.price*(u==='kg'?q:u==='g'?q/1000:q);if(p.unit==='g')return p.price*(u==='kg'?q*1000:q);return p.price*q;}
function renderProducts(){
 const q=$('search').value.trim().toLowerCase();
 const list=products.filter(p=>p.name.toLowerCase().includes(q));
 $('productGrid').innerHTML=list.length?list.map(p=>{
  const c=cart[p.id];
  let controls='';
  if(p.unit==='piece'){
   controls=`<div class="actions"><button class="primary" type="button" onclick="addCart('${p.id}')">＋ افزودن یک عدد</button>${c?`<button class="danger" type="button" onclick="removeCart('${p.id}');renderProducts()">حذف</button>`:''}</div>${c?`<div class="muted">تعداد انتخاب‌شده: ${fmt(c.qty)} عدد</div>`:''}`;
  } else {
   const kg=c?(c.unit==='kg'?Number(c.qty):c.unit==='g'?Number(c.qty)/1000:0):0;
   controls=`<div class="actions"><button class="primary" type="button" onclick="addCart('${p.id}',1)">＋ ۱ کیلو</button><button class="secondary" type="button" onclick="addCart('${p.id}',0.5)">＋ نیم کیلو</button></div>${c?`<div class="shopqty"><span class="muted">مجموع انتخاب‌شده: ${fmt(kg)} کیلو</span><button class="danger small" type="button" onclick="removeCart('${p.id}');renderProducts()">حذف از انتخاب‌ها</button></div>`:''}`;
  }
  return `<article class="product"><img src="${p.image||placeholder}" alt=""><div class="info"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)} / ${productUnit(p)}</div>${controls}<div class="actions" style="margin-top:7px"><button class="secondary" type="button" onclick="editProduct('${p.id}')">ویرایش کالا</button></div></div></article>`;
 }).join(''):'<div class="empty">هنوز کالایی ثبت نشده است.<br>از «ثبت کالا» شروع کنید.</div>';
 $('cartCount').textContent=fmt(Object.keys(cart).length);
}

function addCart(id,kgAmount){const p=products.find(x=>x.id===id);if(!p)return;if(p.unit==='piece'){if(!cart[id])cart[id]={qty:0,unit:'piece'};cart[id].qty+=1;}else{if(!cart[id])cart[id]={qty:0,unit:'kg'};if(cart[id].unit==='g'){cart[id].qty=Number(cart[id].qty)/1000;cart[id].unit='kg';}else if(cart[id].unit!=='kg'){cart[id].qty=0;cart[id].unit='kg';}cart[id].qty+=Number(kgAmount)||1;}save();renderProducts();}
function changeShopQty(id,v){if(!cart[id])return;cart[id].qty=Math.max(0,Number(v)||0);save();}
function changeShopUnit(id,v){if(!cart[id])return;cart[id].unit=v;save();renderProducts();}

function renderCart(){const ids=Object.keys(cart).filter(id=>products.some(p=>p.id===id));let sum=0;$('cartCount').textContent=fmt(ids.length);$('cartItems').innerHTML=ids.length?ids.map(id=>{const p=products.find(x=>x.id===id),c=cart[id],v=priceFor(p,Number(c.qty)||0,c.unit);sum+=v;return `<div class="cartitem"><img src="${p.image||placeholder}" alt=""><div><h3>${esc(p.name)}</h3><div class="muted">قیمت پایه: ${money(p.price)} / ${productUnit(p)}</div><div class="quantity"><span class="muted">مقدار:</span><input aria-label="مقدار" type="number" min="0" step="any" value="${c.qty}" onchange="changeQty('${id}',this.value)"><select aria-label="واحد" onchange="changeUnit('${id}',this.value)"><option value="g" ${c.unit==='g'?'selected':''}>گرم</option><option value="kg" ${c.unit==='kg'?'selected':''}>کیلوگرم</option><option value="piece" ${c.unit==='piece'?'selected':''}>عدد</option></select><button class="danger small" type="button" onclick="removeCart('${id}')">حذف</button></div><div class="lineprice">${money(v)}</div></div></div>`;}).join(''):'<div class="empty">هنوز کالایی به فاکتور اضافه نشده است.</div>';$('total').textContent=money(sum);save();}
function changeQty(id,v){cart[id].qty=Math.max(0,Number(v)||0);renderCart();}
function changeUnit(id,v){cart[id].unit=v;renderCart();}
function removeCart(id){delete cart[id];renderCart();}
$('clearCart').addEventListener('click',()=>{if(confirm('همه اقلام فاکتور حذف شوند؟')){cart={};renderCart();}});
function renderManage(){$('manageList').innerHTML=products.length?products.map(p=>`<div class="row"><img src="${p.image||placeholder}" style="width:48px;height:48px;object-fit:cover;border-radius:8px" alt=""><div class="grow"><b>${esc(p.name)}</b><div class="muted">${money(p.price)} / ${productUnit(p)}</div></div><button class="secondary small" type="button" onclick="editProduct('${p.id}')">ویرایش</button><button class="danger small" type="button" onclick="deleteProduct('${p.id}')">حذف</button></div>`).join(''):'<p class="muted">کالایی ثبت نشده است.</p>';}
$('pimage').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('لطفاً فایل عکس انتخاب کنید.');e.target.value='';return;}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);imageData=c.toDataURL('image/jpeg',0.78);$('preview').src=imageData;$('preview').style.display='block';};im.onerror=()=>alert('خواندن عکس ناموفق بود. عکس دیگری انتخاب کنید.');im.src=r.result;};r.onerror=()=>alert('خواندن فایل عکس ناموفق بود.');r.readAsDataURL(f);});
$('productForm').addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value||String(Date.now())+Math.random().toString(16).slice(2);const old=products.find(p=>p.id===id);const p={id,name:$('pname').value.trim(),price:Math.max(0,Number($('pprice').value)||0),unit:$('punit').value,image:imageData||(old&&old.image)||''};if(old)products=products.map(x=>x.id===id?p:x);else products.push(p);save();resetForm();renderProducts();renderManage();alert('کالا ذخیره شد.');});
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;switchTab('manage');$('editId').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('punit').value=p.unit;imageData=p.image||'';$('preview').src=imageData||placeholder;$('preview').style.display='block';$('formTitle').textContent='✏️ ویرایش کالا';$('saveProduct').textContent='ذخیره تغییرات';$('cancelEdit').style.display='inline-block';$('pname').focus();}
function resetForm(){$('productForm').reset();$('editId').value='';imageData='';$('preview').style.display='none';$('formTitle').textContent='➕ ثبت کالای جدید';$('saveProduct').textContent='ذخیره کالا';$('cancelEdit').style.display='none';}
$('cancelEdit').addEventListener('click',resetForm);
function deleteProduct(id){const p=products.find(x=>x.id===id);if(p&&confirm('کالای «'+p.name+'» حذف شود؟')){products=products.filter(x=>x.id!==id);delete cart[id];save();renderProducts();renderManage();renderCart();}}
function invoiceText(){const lines=['فاکتور فروش بازار','خریدار: '+($('buyer').value.trim()||'—'),'------------------------'];let sum=0;Object.keys(cart).forEach(id=>{const p=products.find(x=>x.id===id);if(!p)return;const c=cart[id],v=priceFor(p,Number(c.qty)||0,c.unit);sum+=v;lines.push(`${p.name} | ${fmt(c.qty)} ${c.unit==='g'?'گرم':c.unit==='kg'?'کیلوگرم':'عدد'} | ${money(v)}`);});lines.push('------------------------','جمع کل: '+money(sum));return lines.join('\n');}
$('copyInvoice').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(invoiceText());alert('متن فاکتور کپی شد.');}catch(e){prompt('متن فاکتور را کپی کنید:',invoiceText());}});
$('shareInvoice').addEventListener('click',async()=>{const text=invoiceText();if(navigator.share){try{await navigator.share({title:'فاکتور فروش',text});}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('متن فاکتور کپی شد.');}catch(e){prompt('متن فاکتور:',text);}}});
$('backupData').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,products,cart},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bazar-invoice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
$('restoreData').addEventListener('click',()=>$('restoreFile').click());
$('restoreFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.products))throw new Error('invalid');if(!confirm('اطلاعات فعلی با '+d.products.length+' کالا جایگزین شود؟'))return;products=d.products;cart=d.cart&&typeof d.cart==='object'?d.cart:{};if(db){await dbSet('products',products);await dbSet('cart',cart);}else save();renderProducts();renderManage();renderCart();alert('پشتیبان بازیابی شد.');}catch(err){alert('فایل پشتیبان معتبر نیست.');}finally{e.target.value='';}});
initStorage();
</script></body></html>
